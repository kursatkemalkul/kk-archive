<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="autokitch-cost-reader" content="1"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVOKITCH · Maliyet hesabı</title><style>body{font:16px system-ui;color:#1c2942;margin:3rem auto;padding:0 1rem;max-width:30rem}button{font:inherit;background:#2f61ec;color:white;border:none;border-radius:.6rem;padding:.7rem 1rem;cursor:pointer}</style>
<h1>Maliyet hesabı</h1><p id="status">Sunum bağlantısı bekleniyor.</p><button id="signin" type="button" hidden>Google hesabımla bağlan</button>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/autokitch/sunum/hesap-model-r120.js?v=125"></script>
<script>
const pinFirebaseConfig={
      apiKey: "AIzaSyAffxPdRyYEvhlsHlDBlGf7g4iu2wnzf3c",
      authDomain: "gen-lang-client-0276539885.firebaseapp.com",
      projectId: "gen-lang-client-0276539885"
    };
(() => {
  'use strict';
  if(location.hash==='#cihaz-kaydi'){
    const keys=['ak_hesap_v4','ak_yatirim_v2','ak_flags_v1','ak_mt'];
    const saved=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));
    const title=document.createElement('h2');title.textContent='Bu cihazdaki maliyet kaydı';
    const text=document.createElement('pre');text.id='cihaz-kaydi';text.style.cssText='white-space:pre-wrap;font-size:12px';
    text.textContent=JSON.stringify(saved,null,2);document.body.append(title,text);
  }
  const allowedHashes=["fe97000a2c1054fe83f174b25c03caa9d44ec4d90a31ba996a20cd107a8d6bf7", "8beab1038d860e06886645adbde4eac08a28e0a70d02c488c518cb8cac4b8a0e"];
  let host=null;
  const parentWindow=window.opener || (window.parent!==window ? window.parent : null);
  const status=document.getElementById('status'), login=document.getElementById('signin');
  const protocol='autokitch-cost-v1';
  let channel=null, listen=null, authStop=null, latest=null;
  function send(kind,extra={}) {
    if(channel && parentWindow) parentWindow.postMessage({protocol,channel,kind,...extra},host);
  }
  function clearListener() { if(listen) listen(); listen=null; }
  function flag(kind,text) {status.textContent=text;send(kind);}
  function start() {
    if(authStop) return;
    if(!window.firebase || !window.PinCost) {flag('offline','Bağlantı kurulamadı.');return;}
    if(!firebase.apps.length) firebase.initializeApp(pinFirebaseConfig);
    // Only calculated business figures leave this origin. Authentication and individual salaries stay here.
    authStop=firebase.auth().onAuthStateChanged(user=>{
      clearListener();latest=null;login.hidden=!!user;
      if(!user) {flag('auth','Kayıtlı maliyet hesabını açmak için bağlanın.');return;}
      listen=firebase.firestore().collection('autokitch').doc('hesap').onSnapshot({includeMetadataChanges:true},snap=>{
        if(snap.metadata.hasPendingWrites||snap.metadata.fromCache) return;
        if(!snap.exists) {flag('empty','Bu hesapta kayıtlı maliyet bulunamadı.');return;}
        try {
          const record=snap.data();
          if(!JSON.parse(typeof record.data==='string'?record.data:JSON.stringify(record.data||{})).ak_hesap_v4) {
            flag('empty','Güncel biçimde kaydedilmiş bir hesap bulunamadı.');return;
          }
          latest={report:window.PinCost.summary(record),asOf:Number(record.mt)||0};
          send('report',latest);
          status.textContent='Hesap bağlandı. Sunuma geri dönebilirsiniz.';
        } catch {flag('unavailable','Bu kayıt sunumda okunamıyor.');}
      },()=>flag('denied','Bu hesap maliyet kaydına erişemiyor.'));
    },()=>flag('offline','Google oturumu açılamadı.'));
  }
  login.addEventListener('click',()=>firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(()=>{status.textContent='Google oturumu tamamlanmadı. Tekrar deneyebilirsiniz.';}));
  window.addEventListener('message',async event=>{
    if(event.source!==parentWindow || !parentWindow || !event.origin.startsWith('https://')) return;
    const m=event.data;
    if(!m || m.protocol!==protocol || m.kind!=='connect' || typeof m.channel!=='string' || !/^[a-f\d-]{36}$/.test(m.channel)) return;
    const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(event.origin))),b=>b.toString(16).padStart(2,'0')).join('');
    if(!allowedHashes.includes(hash)) return;
    host=event.origin;
    if(channel===m.channel) return;
    channel=m.channel;send('connected');if(latest) send('report',latest);start();
  });
  window.addEventListener('pagehide',()=>{clearListener();if(authStop) authStop();});
})();

</script></html>
