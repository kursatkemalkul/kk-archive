<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTOKITCH · QR teslim paneli</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#111920;color:#eff6f9}body{display:grid;place-items:center}.hardware{display:flex;flex-direction:column;width:min(340px,95vw);padding:24px;background:linear-gradient(120deg,#dbe0e4,#a7b1b9);border-radius:8px;box-shadow:0 12px 40px #0006;color:#17232c}.lcd{aspect-ratio:16/9;width:100%;background:#8a2c08;border:6px solid #172129;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;color:#fff4e6;overflow:hidden}.lcd small{font-size:12px;letter-spacing:1px;color:#ffc083}.lcd h1{font-size:22px;line-height:1.15;margin:8px 0 4px}.lcd strong{font-size:30px;letter-spacing:7px;min-height:38px}.lcd p{font-size:12px;margin:6px 0 0;color:#f0d8c6}.reader{order:-1;margin:0 auto 14px;width:78px;height:38px;background:#0b1720;border:5px solid #2d3942;border-radius:3px;display:grid;place-items:center;color:#91c0cb;font-size:12px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:190px;margin:0 auto}.keys button{height:42px;font-size:23px;font-weight:650;background:linear-gradient(#e7ebee,#bac4cc);color:#18252e;border:1px solid #7a8995;border-radius:3px;box-shadow:0 2px 0 #657480;cursor:pointer}.keys button:active{transform:translateY(2px);box-shadow:none}.note{text-align:center;font-size:12px;line-height:1.5;margin:16px 0 0;color:#354650}.screen-only .hardware{width:100%;height:100%;padding:0;box-shadow:none;border-radius:0;background:none}.screen-only .lcd{height:100%;border:0;aspect-ratio:auto;padding:10px}.screen-only .lcd small{font-size:18px}.screen-only .lcd h1{font-size:30px;margin:12px 0 8px}.screen-only .lcd strong{font-size:48px;min-height:58px}.screen-only .lcd p{font-size:18px}.screen-only .reader,.screen-only .keys,.screen-only .note{display:none}
</style></head><body><main class="hardware" aria-label="QR dolabı fiziksel teslim paneli"><section class="lcd" aria-label="Küçük durum ekranı" aria-live="polite"><small>AUTOKITCH · TESLİM</small><h1 id="title">Kodunu gir</h1><strong id="code">— — — —</strong><p id="hint">Fiziksel tuş takımı · # onay · * sil</p></section><div class="reader" aria-label="QR okuyucu">QR</div><div class="keys" aria-label="Fiziksel tuş takımının Twin karşılığı"></div><p class="note">Ekran bilgi gösterir; kod alttaki fiziksel tuşlarla girilir.<br>Bu tuşlar dolaptaki 3B tuşlarla aynı komuta bağlıdır.</p></main>
<script src="../ortak/goz-etiket.js"></script>
<script>
const q=new URLSearchParams(location.search);if(q.has('ekran'))document.body.classList.add('screen-only');
let state={kod:'',sonuc:'',kilit_s:0},lastEvent=null,eventText='',eventUntil=0;
const title=document.getElementById('title'),code=document.getElementById('code'),hint=document.getElementById('hint');
function render(){code.textContent=state.kod?'•'.repeat(state.kod.length):'— — — —';title.textContent='Kodunu gir';hint.textContent='Fiziksel tuş takımı · # onay · * sil';
 if(state.kilit_s>0){title.textContent='Lütfen bekleyin';code.textContent=Math.ceil(state.kilit_s)+' sn';hint.textContent='Çok fazla yanlış deneme';}
 else if(state.kod){}else if(eventText&&Date.now()<eventUntil){title.textContent=eventText;code.textContent='';hint.textContent='Ürününüzü alın; kapağı kapatın';}
 else if(state.sonuc==='red'){title.textContent='Kod doğrulanamadı';hint.textContent='Kodunu kontrol edip tekrar gir';}
 else if(state.sonuc==='gönderildi'){title.textContent='Kod kontrol ediliyor';hint.textContent='Dolap yanıtı bekleniyor';}}
function key(t){if(parent===window){hint.textContent='Tuşları Digital Twin içinden kullanın';return;}parent.postMessage({tip:'autokitch.qr.tus',tus:t},location.origin);}
for(const t of ['1','2','3','4','5','6','7','8','9','*','0','#']){const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-label',t==='*'?'Sil':t==='#'?'Onayla':t);b.onclick=()=>key(t);document.querySelector('.keys').append(b);}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.tip!=='autokitch.qr.pin')return;state={kod:String(e.data.kod||''),sonuc:String(e.data.sonuc||''),kilit_s:Number(e.data.kilit_s)||0};render();});
addEventListener('keydown',e=>{const k=e.key==='Enter'?'#':e.key==='Backspace'?'*':e.key;if(/^([0-9]|\*|#)$/.test(k)){e.preventDefault();key(k);}});
async function events(){try{const r=await fetch('/api/dolap/olay?'+(lastEvent===null?'son=1':'sonra='+lastEvent+'&son=30'),{cache:'no-store'});if(!r.ok)return;const j=await r.json(),first=lastEvent===null;for(const e of j.olaylar||[]){lastEvent=Math.max(lastEvent||0,e.id||0);if(first)continue;if(e.tip==='qr.opened'){eventText='Göz '+AK_GOZ.etiket(e.goz)+' açıldı';eventUntil=Date.now()+12000;}if(e.tip==='qr.closed'){eventText='Teşekkürler';eventUntil=Date.now()+3500;}if(e.tip==='qr.code_rejected'){state.sonuc='red';}}if(lastEvent===null)lastEvent=0;render();}catch{}}
events();setInterval(events,1000);
</script></body></html>
