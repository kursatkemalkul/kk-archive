<title>AUTOKITCH · Digital Twin</title>
<style>
:root { --bg:#0f1318; --pn:#171d25; --pn2:#1f2731; --cz:#303a47; --yz:#e8edf3; --sol:#8d9bad; --vr:#e8b04a; --ok:#4fc08d; --hata:#ef6f6c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--yz); font: 13px/1.35 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
#ana { display: grid; grid-template-columns: minmax(0, 1fr) 540px; height: 100%; }
#sahne { position: relative; min-width: 0; background: #1a2029; }
#kanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#yukle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #1a2029; z-index: 5; }
#yukle .cubuk { width: 320px; height: 6px; background: var(--cz); border-radius: 3px; overflow: hidden; }
#yukle .cubuk i { display: block; height: 100%; width: 0; background: var(--vr); }
.hud { position: absolute; z-index: 3; background: rgba(15, 19, 24, .82); border: 1px solid var(--cz); border-radius: 8px; padding: 8px 10px; backdrop-filter: blur(4px); }
#hudUst { top: 10px; left: 10px; min-width: 250px; }
#hudUst b { color: var(--vr); }
#hudUst .sat { display: flex; justify-content: space-between; gap: 14px; }
#hudUst .sol { color: var(--sol); }
#hudAlt { left: 10px; bottom: 10px; width: 420px; max-height: 32%; overflow: hidden; font-size: 12px; }
#hudAlt summary, #hudUst summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 22px; font-size: 11px; letter-spacing: .05em; color: var(--sol); font-weight: 600; cursor: pointer; list-style: none; user-select: none; }
.hud summary::-webkit-details-marker { display: none; }
.hud summary::after { content: '+'; color: var(--vr); font-size: 18px; line-height: 1; }
.hud[open] summary::after { content: '−'; }
.hud[open] summary { margin-bottom: 6px; }
.hud summary:focus-visible { outline: 2px solid var(--vr); outline-offset: 3px; border-radius: 2px; }
#hudUst, #hudAlt { max-width: calc(100% - 20px); }
#hudUst:not([open]), #hudAlt:not([open]) { width: max-content; min-width: 0; }
#hudUst[open] { max-height: 65%; overflow: auto; z-index: 6; }
#hudAlt[open] { overflow: auto; z-index: 6; }
#olaylar { font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#olaylar div { overflow: hidden; text-overflow: ellipsis; }
#gozler { position: absolute; z-index: 3; top: 66px; right: 10px; display: grid; grid-template-columns: repeat(2, 54px); gap: 4px; }
#gozler div { background: rgba(15, 19, 24, .82); border: 1px solid var(--cz); border-radius: 6px; padding: 3px 5px; font-size: 10.5px; text-align: center; }
#gozler div.dolu { border-color: var(--vr); } #gozler div.acik { border-color: var(--ok); background: rgba(79, 192, 141, .2); }
#roller { position: absolute; z-index: 4; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 4px; }
#araclar { position: absolute; z-index: 3; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 20px); gap: 4px; }
#makineKontrol { position: absolute; z-index: 40; right: 10px; top: 10px; display: flex; gap: 6px; }
#makineKontrol button { min-height: 44px; padding: 8px 16px; font-weight: 700; }
#copDenemeMenu { position:relative; font-size:12px; }
#copDenemeMenu summary { cursor:pointer; padding:12px; background:var(--pn2); border:1px solid var(--cz); border-radius:6px; list-style:none; }
.copDenemeIcerik { position:absolute; right:0; top:48px; width:min(320px,85vw); padding:14px; background:var(--pn); border:1px solid var(--cz); border-radius:8px; box-shadow:0 8px 30px #0008; }
.copDenemeIcerik p { line-height:1.5; color:var(--sol); }
.copDenemeIcerik select { background:var(--pn2); color:var(--yz); padding:8px; margin:8px; }
#copDenemeBaslat { width:100%; }
#resetBtn { background: #b74529; border-color: #ffad77; color: #fff; }
button { background: var(--pn2); color: var(--yz); border: 1px solid var(--cz); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--vr); } button.ak { background: var(--vr); color: #111; border-color: var(--vr); }
#yan { display: flex; flex-direction: column; min-width: 0; background: var(--pn); border-left: 1px solid var(--cz); }
#sekmeler { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid var(--cz); }
#cerceve { flex: 1; min-height: 0; position: relative; }
#cerceve iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
#cerceve iframe.ak { display: block; }
#baglanti { position: absolute; z-index: 4; left: 50%; top: 46px; transform: translateX(-50%); padding: 3px 12px; border-radius: 12px; background: var(--hata); color: #fff; font-size: 12px; display: none; }
#baglanti.var { display: block; }
.uyari { color: var(--hata); }
@media (max-width: 900px) { #ana { grid-template-columns: 1fr; grid-template-rows: 58% 42%; } }
/* IKIZ-ARAYUZ-2 (10 Eki): sağ panel gizlenebilir (Panel düğmesi / P) */
body.panelGizli #ana { grid-template-columns: minmax(0, 1fr) 0; }
body.panelGizli #yan { display: none; }
@media (max-width: 900px) { body.panelGizli #ana { grid-template-rows: 100% 0; } }
</style>

  </div>
  <div id="yan">
    <div id="sekmeler"></div>
    <div id="cerceve"></div>
  </div>
</div>
