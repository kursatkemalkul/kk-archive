<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>AUTOKITCH · Film Stüdyosu</title>
<style>*{box-sizing:border-box}html,body,main{height:100%;margin:0;background:#0b0d10;color:#eef0f4;font:14px system-ui}iframe{width:100%;height:100%;border:0;display:block}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;padding:24px;background:#0b0d10}#status span{color:#a0a9b5}button,a{color:#eebd72}button{background:transparent;border:1px solid #66543a;padding:10px 16px;border-radius:6px;cursor:pointer}[hidden]{display:none!important}</style></head>
<body><main><div id="status" role="status"><strong>AUTOKITCH · Film Stüdyosu</strong><span id="message">25 saniyelik kamera provası hazırlanıyor…</span><button id="retry">Yeniden bağlan</button></div><iframe id="viewer" title="AUTOKITCH · Bağımsız Film Stüdyosu" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-downloads" allow="fullscreen; autoplay; clipboard-write" allowfullscreen referrerpolicy="no-referrer" hidden></iframe></main>
<script>
const frame=document.getElementById('viewer'),statusEl=document.getElementById('status'),message=document.getElementById('message');
let pending=false,active='',loaded=false;
frame.addEventListener('load',()=>{if(!active)return;loaded=true;frame.hidden=false;statusEl.hidden=true;});
async function connect(){
 if(pending)return;pending=true;
 try{
  const r=await fetch('./live.json?v='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('registry');
  const record=await r.json(),url=new URL(record.url);if(url.protocol!=='https:'||!url.hostname.endsWith('.trycloudflare.com')||url.username||url.password)throw Error('address');
  if(active!==url.origin){
   const health=await fetch(url.origin+'/healthz?v='+Date.now(),{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(10000)});if(!health.ok||(await health.json()).studio!=='ok')throw Error('offline');
   active=url.origin;url.pathname='/ikiz/web/tanitim/';url.search='';url.hash='';loaded=false;statusEl.hidden=false;frame.hidden=false;frame.src=url.href;
  }
 }catch{if(!loaded){statusEl.hidden=false;message.textContent='Film yayınına şu anda ulaşılamıyor. Stüdyo bilgisayarı açık olduğunda otomatik bağlanacak.';}}
 finally{pending=false;}
}
document.getElementById('retry').onclick=()=>{active='';loaded=false;connect()};connect();setInterval(connect,10000);
</script></body></html>
