name: deploy

# industrialproductdesigner.com — portfolyo + alt siteleri birlestirip yayinlar.
# Alt siteler kendi depolarindan cekilir: alancast, highline, nakit.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [site-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stage portfolio
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.publication' --exclude '_site' \
                --exclude 'alancast' --exclude 'autokitch' --exclude 'digital-twin' \
                --exclude 'film-studyo' --exclude 'montaj' --exclude 'pin-film' \
                --exclude 'highline' --exclude 'nakit' \
                ./ _site/

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kursatkemalkul/alancast
          path: _site/alancast
          ssh-key: ${{ secrets.ALANCAST_SITE_READ_KEY }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kursatkemalkul/highline
          path: _site/highline
          ssh-key: ${{ secrets.HIGHLINE_SITE_READ_KEY }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kursatkemalkul/nakit
          path: _site/nakit
          ssh-key: ${{ secrets.NAKIT_SITE_READ_KEY }}
          persist-credentials: false

      - name: Drop nested .git dirs
        run: rm -rf _site/*/.git

      - name: Archive GitHub Pages artifact
        run: tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # GitHub'in gecici "try again later" hatasina karsi: basarisizsa bekleyip tekrar dene
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
