name: deploy

# industrialproductdesigner.com — portfolyo + alt siteleri birlestirip yayinlar.
# Alt siteler kendi depolarindan cekilir: alancast, autokitch, highline, nakit.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [site-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stage portfolio
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                --exclude 'alancast' --exclude 'autokitch' \
                --exclude 'highline' --exclude 'nakit' \
                ./ _site/

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: kursatkemalkul/alancast, path: _site/alancast }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kursatkemalkul/autokitch
          path: _site/autokitch
          ssh-key: ${{ secrets.AUTOKITCH_SITE_READ_KEY }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/_local/
            !/arastirma/
            !/uretim/
            !/supplier-review/
            !/otonom/hat/
            !/otonom/hat3d/
            !/otonom/birlesik/
            !/otonom/kaset3d/
            !/otonom/elektrik/
            !/otonom/onizleme-9eki/
            !*.glb*
            !*.gltf*
            !*.stp
            !*.step
            !*.stl
            !*.bin
            !*.zip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: kursatkemalkul/highline, path: _site/highline }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: kursatkemalkul/nakit, path: _site/nakit }

      - name: Drop nested .git dirs
        run: rm -rf _site/*/.git

      # Güvenlik: autokitch'in _local klasörü (yerel yedekler, oturum kayıtları) siteye konmaz; GitHub'da kalır
      - name: Drop autokitch _local
        run: rm -rf _site/autokitch/_local

      # Güvenlik: autokitch'in _local klasörü (yerel yedekler, oturum kayıtları) siteye konmaz
      - name: Drop autokitch _local
        run: rm -rf _site/autokitch/_local

      - name: Keep machine models and engineering sources private
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root=Path('_site/autokitch').resolve()
          private=['_local','arastirma','uretim','supplier-review','otonom/hat','otonom/hat3d','otonom/birlesik','otonom/kaset3d','otonom/elektrik','otonom/onizleme-9eki']
          redirect='<html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/digital-twin/"></head><body><a href="/digital-twin/">AUTOKITCH Digital Twin</a></body></html>'
          for name in private:
              target=(root/name).resolve()
              assert root in target.parents
              if target.exists(): shutil.rmtree(target)
              if name.startswith('otonom/'):
                  target.mkdir(parents=True,exist_ok=True)
                  (target/'index.html').write_text(redirect,encoding='utf8')
          suffixes={'.glb','.gltf','.stp','.step','.stl','.obj','.mtl','.iges','.igs','.sldprt','.sldasm','.fcstd','.blend','.fbx','.dae','.3dm','.dxf','.dwg','.bin','.zip','.scl','.st','.awl','.lad','.fbd','.zap','.ap17','.ap18','.ap19','.db','.sqlite','.sqlite3'}
          for item in root.rglob('*'):
              if item.is_file() and (item.suffix.lower() in suffixes or '.glb.' in item.name.lower()): item.unlink()
          remaining=[str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and (p.suffix.lower() in suffixes or '.glb.' in p.name.lower())]
          assert not remaining, 'Private model files found in website artifact'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: _site }

      # GitHub'in gecici "try again later" hatasina karsi: basarisizsa bekleyip tekrar dene
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
