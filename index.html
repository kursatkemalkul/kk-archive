<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Portfolio CV 2026</title>

    <!-- Private portfolio — block search engines + AI crawlers -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="GPTBot" content="noindex, nofollow">
    <meta name="ClaudeBot" content="noindex, nofollow">
    <meta name="PerplexityBot" content="noindex, nofollow">

    <!-- Performance hints -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www-ccv.adobe.io">
    <link rel="preload" href="pdf/portfolio.pdf" as="fetch" type="application/pdf" crossorigin>

    <link rel="stylesheet" href="css/style.css?v=6">
    <link rel="icon" type="image/svg+xml" href="images/favicon-k.svg">
</head>
<body>

    <!-- Erisim kapisi -->
    <style>
      #ipd-gate{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      #ipd-gate.hide{display:none}
      #ipd-gate .box{text-align:center;padding:24px}
      #ipd-gate .mark{color:#fff;font-size:15px;letter-spacing:.28em;margin-bottom:26px;opacity:.85}
      #ipd-gate input{background:transparent;border:none;border-bottom:1px solid #555;color:#fff;font-size:20px;letter-spacing:.35em;text-align:center;padding:8px 4px;width:190px;outline:none}
      #ipd-gate input:focus{border-bottom-color:#fff}
      #ipd-gate .hint{color:#666;font-size:11px;margin-top:16px;letter-spacing:.06em}
      #ipd-gate.err input{border-bottom-color:#c0392b}
      html.ipd-locked body>*:not(#ipd-gate){visibility:hidden}
    </style>
    <div id="ipd-gate">
      <div class="box">
        <div class="mark">K K K</div>
        <input id="ipd-pass" type="password" inputmode="numeric" autocomplete="off" autofocus>
        <div class="hint">enter code</div>
      </div>
    </div>
    <script>
    (function(){
      var KEY='ipd_ok_v1', CODE='1783', root=document.documentElement;
      var gate=document.getElementById('ipd-gate'), inp=document.getElementById('ipd-pass');
      function unlock(){ root.classList.remove('ipd-locked'); gate.classList.add('hide'); }
      try{ if(localStorage.getItem(KEY)==='1'){ unlock(); return; } }catch(e){}
      root.classList.add('ipd-locked');
      function tryCode(){
        if(inp.value===CODE){ try{localStorage.setItem(KEY,'1');}catch(e){} unlock(); }
        else { gate.classList.add('err'); inp.value=''; setTimeout(function(){gate.classList.remove('err');},600); }
      }
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryCode(); });
      inp.addEventListener('input', function(){ if(inp.value.length>=4) tryCode(); });
      setTimeout(function(){ try{inp.focus();}catch(e){} }, 50);
    })();
    </script>

    <span class="page-counter"><span id="page-current">01</span> / <span id="page-total">--</span></span>

    <main class="deck" id="deck">
        <!-- Slides are inserted dynamically by JS: PDF pages + videos interleaved -->
    </main>

    <!-- Loading overlay -->
    <div class="pdf-loading" id="pdfLoading">
        <div class="pdf-loading__spinner"></div>
        <div class="pdf-loading__text">Loading portfolio<span class="pdf-loading__dots">…</span></div>
        <div class="pdf-loading__progress"><div class="pdf-loading__bar" id="pdfLoadingBar"></div></div>
    </div>

    <button class="home-btn" id="navHome" aria-label="Back to start" title="Back to start">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </button>

    <button class="nav-arrow nav-arrow--prev" id="navPrev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-arrow nav-arrow--next" id="navNext" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <script type="module" src="js/script.js?v=6"></script>
</body>
</html>
