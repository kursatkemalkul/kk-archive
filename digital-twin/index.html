<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>AUTOKITCH · Digital Twin</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101820;color:#edf2f5;font:14px system-ui}main{position:relative;height:100%}iframe{width:100%;height:100%;border:0;display:block}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#101820;color:#bac8d1;pointer-events:none}#status[hidden],[hidden]{display:none!important}</style></head>
<body>
<main><div id="status" role="status">Digital Twin bağlantısı hazırlanıyor…</div><iframe id="viewer" title="AUTOKITCH · Digital Twin" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-downloads" allow="fullscreen; autoplay; clipboard-write" allowfullscreen referrerpolicy="no-referrer" hidden></iframe></main>
<script>
const registry='/digital-twin/live.json';
const frame=document.getElementById('viewer'),statusEl=document.getElementById('status');
let pending=false,lastLookup=0,record=null,activeOrigin='',loaded=false;
history.replaceState(null,'',location.pathname);
frame.addEventListener('load',()=>{if(!activeOrigin)return;loaded=true;frame.hidden=false;statusEl.hidden=true;});
async function connect(){
 if(pending)return;pending=true;
 try{
  if(!record||Date.now()-lastLookup>60000){
   const r=await fetch(registry+'?v='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error();
   record=await r.json();lastLookup=Date.now();
  }
  const url=new URL(record.url);if(url.protocol!=='https:'||!url.hostname.endsWith('.trycloudflare.com'))throw Error();
  if(url.origin!==activeOrigin){
   const r=await fetch(url.origin+'/healthz?v='+Date.now(),{credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error();
   const health=await r.json();if(health.gateway!=='ok')throw Error();
   activeOrigin=url.origin;url.pathname='/ikiz/';url.search='';url.hash='';frame.hidden=false;loaded=false;statusEl.hidden=false;frame.src=url.href;
  }
 }catch{if(!loaded){statusEl.hidden=false;statusEl.textContent='Yayın şu anda hazır değil. Bağlantı otomatik olarak tekrar denenecek.';}}
 finally{pending=false;}
}
connect();setInterval(connect,5000);
</script></body></html>
